name: Refresh live data

# Weekly: re-pull NHTSA complaint/recall counts and the BLS used-car price
# trend into data/live-data.json. The commit it pushes triggers a normal
# Vercel deploy, which bakes the new numbers into every page.
on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-live-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --ssr src/entry-server.jsx --outDir dist-ssr
      - run: node scripts/refresh-live-data.mjs
      - name: Commit and push if the data changed
        run: |
          if git diff --quiet -- data/live-data.json; then
            echo "No changes to live data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-data.json
          git commit -m "Refresh live data (NHTSA complaints/recalls, BLS used-car prices)"
          git push
